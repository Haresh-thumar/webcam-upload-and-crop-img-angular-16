<!-----------------------------------------------------------------------------------------
                                        Webcam-Image
------------------------------------------------------------------------------------------>
<div class="container mt-5">
    <h2>Angular Webcam Capture Image from Camera</h2>
    <div class="row">
        <!--------------- Webcam-Image ---------------->
        <div class="col-6">
            <webcam
                [trigger]="invokeObservable"
                (imageCapture)="captureImg($event)"></webcam>
            <button class="btn btn-danger" (click)="getSnapshot()"> Capture Image </button>
        </div>
        <!--------------- Show Image ---------------->
        <div class="col-6">
            <div id="results">Your taken image manifests here...</div>
            <img [src]="webcamImage.imageAsDataUrl" height="400px" />
        </div>
    </div>
    <div class="card mb-4">
        <p class="p-3">{{webcamImage.imageAsDataUrl}}</p>
    </div>
</div>
